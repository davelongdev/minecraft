#!/usr/bin/nft -f
# /etc/nftables.conf  —  studio Minecraft box
# Inbound: SSH from the studio LAN (and Tailscale once installed), game ports
# 25565-25573 from anywhere, resource-pack HTTP 8080 from the LAN and
# Tailscale. Everything else (RCON 25575+, Query) is dropped.
# Reload with: nft -f /etc/nftables.conf   (check first: nft -c -f ...)

flush ruleset

define lan = 192.168.0.0/24
define mc_ports = { 25565-25574, 25585-25588 }

table inet filter {
  # per-address meter for new game connections (element kept 10 min after last hit)
  set mc_abusers { type ipv4_addr; flags dynamic, timeout; timeout 10m; }

  chain input {
    type filter hook input priority filter; policy drop;

    iif lo accept
    ct state invalid drop
    ct state { established, related } accept
    meta l4proto { icmp, ipv6-icmp } accept

    # admin: SSH from the LAN and over Tailscale
    ip saddr $lan tcp dport ssh ct state new limit rate 15/minute accept
    iifname "tailscale0" tcp dport ssh accept

    # Minecraft game ports: over 20 new connections/minute from one address → dropped
    tcp dport $mc_ports ct state new add @mc_abusers { ip saddr limit rate over 20/minute } drop
    tcp dport $mc_ports ct state new limit rate 60/minute burst 30 packets accept

    # resource packs for clients (mc-www.service)
    ip saddr $lan tcp dport 8080 ct state new accept
    iifname "tailscale0" tcp dport 8080 accept

    # PXE / Clonezilla for the studio laptops (wired only) — enable when built:
    # iifname "enp1s0" udp dport { 67, 69, 4011 } accept   # proxy-DHCP, TFTP
    # iifname "enp1s0" tcp dport { 80, 2049 } accept       # HTTP / NFS images
  }

  chain forward { type filter hook forward priority filter; policy drop; }
  chain output  { type filter hook output  priority filter; policy accept; }
}
